name: Lead Gen Automation

on:
  schedule:
    # Daily at 9:00am Eastern (13:00 UTC) — job search only
    - cron: "0 13 * * *"
    # Extra weekly run at 11:00am Eastern (15:00 UTC) Monday — full run,
    # includes business discovery + tech checks
    - cron: "0 15 * * 1"
  workflow_dispatch: # manual trigger from the Actions tab — always runs "full"

jobs:
  run-lead-gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account credentials
        run: echo '${{ secrets.GOOGLE_SHEETS_CREDS_JSON }}' > service_account.json

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
            echo "mode=jobs_only" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Run lead gen script
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          LEAD_SHEET_ID: ${{ secrets.LEAD_SHEET_ID }}
          GOOGLE_SHEETS_CREDS_PATH: service_account.json
        run: python main.py