name: Daily Job Matcher

on:
  schedule:
    # Twice a day, Toronto time: 9:00am and 6:00pm (catches morning and afternoon/West Coast postings).
    # The Saturday 9:00am run is "full" (jobs + client leads); every other run is jobs only.
    - cron: "37 6 * * *"
      timezone: "America/Toronto"
    - cron: "37 15 * * *"
      timezone: "America/Toronto"
  workflow_dispatch: # manual "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "jobs_only = job matching only · full = also client leads (uses Places credits) · auto = full on Saturday mornings, else jobs_only (used by the outside scheduler)"
        type: choice
        options: [jobs_only, full, auto]
        default: jobs_only

# Lets the run save docs/data/jobs.json and leads.json (the dashboard's data) back to the repo.
permissions:
  contents: write

# Never run two at once, so they can't both write jobs.json.
concurrency:
  group: daily-job-matcher
  cancel-in-progress: false

jobs:
  run-lead-gen:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # never let a run crawl for hours
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the save step can rebase cleanly

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account credentials
        run: echo '${{ secrets.GOOGLE_SHEETS_CREDS_JSON }}' > service_account.json

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" != "auto" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=America/Toronto date +%u)" = "6" ] && [ "$(TZ=America/Toronto date +%H)" -lt 15 ]; then  # Saturday morning
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=jobs_only" >> "$GITHUB_OUTPUT"
          fi

      - name: Run lead gen script
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GMAIL_ALERTS_URL: ${{ secrets.GMAIL_ALERTS_URL }}  # job-alert emails (apps_script/README.md)
          LEAD_SHEET_ID: ${{ secrets.LEAD_SHEET_ID }}
          GOOGLE_SHEETS_CREDS_PATH: service_account.json
        run: python main.py

      - name: Save job matches for the dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json docs/data/leads.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new job matches to save."
            exit 0
          fi
          git commit -m "Update job matches $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
