name: Daily Job Matcher

on:
  schedule:
    # Daily at 9:00am Eastern (13:00 UTC) — job search only
    - cron: "7 13 * * *"
    # Extra weekly run at 11:00am Eastern (15:00 UTC) Monday — full run,
    # includes business discovery + tech checks
    - cron: "0 15 * * 1"
  workflow_dispatch: # manual "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "jobs_only = job matching only · full = also business discovery (uses Places credits)"
        type: choice
        options: [jobs_only, full]
        default: jobs_only

jobs:
  run-lead-gen:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # never let a run crawl for hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account credentials
        run: echo '${{ secrets.GOOGLE_SHEETS_CREDS_JSON }}' > service_account.json

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 15 * * 1" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=jobs_only" >> "$GITHUB_OUTPUT"
          fi

      - name: Run lead gen script
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          LEAD_SHEET_ID: ${{ secrets.LEAD_SHEET_ID }}
          GOOGLE_SHEETS_CREDS_PATH: service_account.json
        run: python main.py
