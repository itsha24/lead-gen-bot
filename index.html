<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lead Gen Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #0F1115;
    --surface: #171A21;
    --surface-raised: #1E222B;
    --border: #2A2F3A;
    --text: #E8EAED;
    --text-muted: #8B92A5;
    --text-faint: #565D6E;
    --accent: #4FD1C5;
    --accent-dim: #2C6E68;
    --status-new: #5B8DEF;
    --status-interested: #A78BFA;
    --status-contacted: #F5B942;
    --status-replied: #4ADE80;
    --status-not: #565D6E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
  }

  .app { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .title-block h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .title-block .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-faint);
  }

  .pulse-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    box-shadow: 0 0 0 0 rgba(79, 209, 197, 0.6);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0.5); }
    70% { box-shadow: 0 0 0 8px rgba(79, 209, 197, 0); }
    100% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0); }
  }

  .refresh-btn {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .refresh-btn:hover { color: var(--text); border-color: var(--accent-dim); }
  .refresh-btn:disabled { opacity: 0.5; cursor: default; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .tab {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); }
  .tab .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    margin-left: 6px;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 9px 14px;
    border-radius: 6px;
    width: 260px;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent-dim); }
  .search-input::placeholder { color: var(--text-faint); }

  .chip {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 7px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(79,209,197,0.08); }
  .chip:hover:not(.active) { color: var(--text); }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }

  thead th {
    text-align: left;
    padding: 12px 14px;
    background: var(--surface-raised);
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  thead th:hover { color: var(--text-muted); }
  thead th.sorted { color: var(--accent); }

  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }

  td { padding: 12px 14px; vertical-align: top; color: var(--text); }
  td.muted { color: var(--text-muted); font-size: 12px; }
  td.mono { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-faint); white-space: nowrap; }

  td a { color: var(--accent); text-decoration: none; }
  td a:hover { text-decoration: underline; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge.new { color: var(--status-new); background: rgba(91,141,239,0.12); }
  .badge.interested { color: var(--status-interested); background: rgba(167,139,250,0.12); }
  .badge.contacted { color: var(--status-contacted); background: rgba(245,185,66,0.12); }
  .badge.replied { color: var(--status-replied); background: rgba(74,222,128,0.12); }
  .badge.not-interested { color: var(--status-not); background: rgba(86,93,110,0.15); }
  .badge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .badge.new .dot { animation: pulse 2s infinite; }

  .empty-state, .loading-state, .error-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  .error-state { color: #F87171; }
  .error-state a { color: var(--accent); }

  .footer-note {
    margin-top: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    line-height: 1.6;
  }
  .footer-note a { color: var(--text-muted); }

  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title-block">
      <h1><span class="pulse-dot"></span>Lead Gen Dashboard</h1>
      <div class="sub" id="last-updated">connecting…</div>
    </div>
    <button class="refresh-btn" id="refresh-btn">↻ refresh</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="Tech Signals">Tech Signals <span class="count" id="count-tech">–</span></button>
    <button class="tab" data-tab="Job Leads">Job Leads <span class="count" id="count-jobs">–</span></button>
  </div>

  <div class="controls">
    <input class="search-input" id="search" placeholder="Search leads…" />
    <div id="status-chips" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
  </div>

  <div class="table-wrap" id="table-wrap">
    <div class="loading-state">loading sheet data…</div>
  </div>

  <div class="footer-note">
    Data pulled live from your Google Sheet. To change a lead's status, edit it directly in
    <a href="https://docs.google.com/spreadsheets/d/1VK5Y0k9S7UPcNK9-uiqMMpPGqht72BlQcs30lAmys1I/edit" target="_blank">the sheet</a> — this dashboard refreshes from there.
  </div>
</div>

<script>
const SHEET_ID = "1VK5Y0k9S7UPcNK9-uiqMMpPGqht72BlQcs30lAmys1I";

const SCHEMAS = {
  "Tech Signals": {
    columns: ["Date Found", "URL", "Tech Detected", "PageSpeed Score", "Flag", "Error", "Status"],
    sortDefault: "Date Found",
  },
  "Job Leads": {
    columns: ["Date Found", "Keyword Matched", "Title", "Company", "Location", "URL", "Description", "Posted", "Status"],
    sortDefault: "Date Found",
  }
};

let state = {
  activeTab: "Tech Signals",
  data: { "Tech Signals": [], "Job Leads": [] },
  search: "",
  statusFilter: null,
  sortCol: "Date Found",
  sortDir: -1,
};

function statusClass(status) {
  const s = (status || "").toLowerCase().replace(/\s+/g, "-");
  if (s.includes("not")) return "not-interested";
  if (s.includes("interested")) return "interested";
  if (s.includes("contact")) return "contacted";
  if (s.includes("repl")) return "replied";
  return "new";
}

async function fetchSheet(tabName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tabName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
  const parsed = JSON.parse(jsonStr);
  const cols = parsed.table.cols.map(c => c.label);
  const rows = parsed.table.rows.map(r => {
    const obj = {};
    cols.forEach((col, i) => {
      const cell = r.c[i];
      obj[col || SCHEMAS[tabName].columns[i]] = cell ? (cell.f ?? cell.v ?? "") : "";
    });
    return obj;
  });
  return rows;
}

async function loadAll(showLoading = true) {
  const wrap = document.getElementById('table-wrap');
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  if (showLoading) wrap.innerHTML = '<div class="loading-state">loading sheet data…</div>';
  try {
    const [tech, jobs] = await Promise.all([
      fetchSheet("Tech Signals"),
      fetchSheet("Job Leads"),
    ]);
    state.data["Tech Signals"] = tech;
    state.data["Job Leads"] = jobs;
    document.getElementById('count-tech').textContent = tech.length;
    document.getElementById('count-jobs').textContent = jobs.length;
    document.getElementById('last-updated').textContent = `synced ${new Date().toLocaleTimeString()}`;
    render();
  } catch (e) {
    wrap.innerHTML = `<div class="error-state">Couldn't load sheet data (${e.message}).<br><br>
      Make sure the sheet is shared as "Anyone with the link can view", and tab names are exactly
      "Job Leads" and "Tech Signals".</div>`;
    document.getElementById('last-updated').textContent = 'sync failed';
  }
  btn.disabled = false;
}

function renderChips() {
  const rows = state.data[state.activeTab];
  const statuses = [...new Set(rows.map(r => r.Status).filter(Boolean))];
  const container = document.getElementById('status-chips');
  container.innerHTML = '';
  statuses.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (state.statusFilter === s ? ' active' : '');
    chip.textContent = s;
    chip.onclick = () => {
      state.statusFilter = state.statusFilter === s ? null : s;
      render();
    };
    container.appendChild(chip);
  });
}

function render() {
  renderChips();
  const schema = SCHEMAS[state.activeTab];
  let rows = [...state.data[state.activeTab]];

  if (state.statusFilter) {
    rows = rows.filter(r => r.Status === state.statusFilter);
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    rows = rows.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q)));
  }

  rows.sort((a, b) => {
    const av = String(a[state.sortCol] || '');
    const bv = String(b[state.sortCol] || '');
    return av.localeCompare(bv) * state.sortDir;
  });

  const wrap = document.getElementById('table-wrap');
  if (rows.length === 0) {
    wrap.innerHTML = '<div class="empty-state">No leads match this view.</div>';
    return;
  }

  const displayCols = schema.columns.filter(c => c !== 'Error' || rows.some(r => r.Error));

  let html = '<table><thead><tr>';
  displayCols.forEach(col => {
    const sorted = state.sortCol === col ? ' sorted' : '';
    const arrow = state.sortCol === col ? (state.sortDir === 1 ? ' ↑' : ' ↓') : '';
    html += `<th class="${sorted.trim()}" data-col="${col}">${col}${arrow}</th>`;
  });
  html += '</tr></thead><tbody>';

  rows.forEach(r => {
    html += '<tr>';
    displayCols.forEach(col => {
      const val = r[col] ?? '';
      if (col === 'Status') {
        html += `<td><span class="badge ${statusClass(val)}"><span class="dot"></span>${val || 'New'}</span></td>`;
      } else if (col === 'URL') {
        const short = String(val).replace(/^https?:\/\//, '').replace(/\/$/, '');
        html += `<td><a href="${val}" target="_blank">${short.length > 45 ? short.slice(0,45)+'…' : short}</a></td>`;
      } else if (col === 'Date Found' || col === 'Posted') {
        html += `<td class="mono">${String(val).slice(0,10)}</td>`;
      } else if (col === 'Description') {
        html += `<td class="muted">${String(val).slice(0,120)}${val.length > 120 ? '…' : ''}</td>`;
      } else {
        html += `<td>${val}</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('th').forEach(th => {
    th.onclick = () => {
      const col = th.dataset.col;
      if (state.sortCol === col) { state.sortDir *= -1; }
      else { state.sortCol = col; state.sortDir = 1; }
      render();
    };
  });
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.activeTab = tab.dataset.tab;
    state.statusFilter = null;
    state.sortCol = SCHEMAS[state.activeTab].sortDefault;
    state.sortDir = -1;
    render();
  };
});

document.getElementById('search').oninput = (e) => {
  state.search = e.target.value;
  render();
};

document.getElementById('refresh-btn').onclick = () => loadAll(false);

loadAll();
</script>
</body>
</html>
